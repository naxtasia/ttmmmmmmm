name: XRDP (Localtonet)
on: workflow_dispatch

jobs:
  ignite-windows:
    runs-on: windows-latest
    steps:
      - name: RDP ve Localtonet Kurulumu
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # 1. RDP Ayarları
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Password = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin"
          $User | Set-LocalUser -Password $Password
          
          # 2. Localtonet İndirme
          Invoke-WebRequest -Uri "https://localtonet.com/download/windows-x64" -OutFile localtonet.zip
          Expand-Archive localtonet.zip -DestinationPath .
          
          # 3. Arka Planda Başlatma (Auth token'ını localtonet sitesinden alıp environment variable olarak ekleyebilirsin)
          # Eğer token girmek istemiyorsan, direkt şu şekilde çalıştırabilirsin:
          Start-Process -FilePath ".\ltn.exe" -ArgumentList "http 3389" -NoNewWindow
          
          Write-Host "========================================================"
          Write-Host "🚀 MATRIX AKTİF (Localtonet)"
          Write-Host "https://localtonet.com adresine git,"
          Write-Host "Tüneller sekmesinden bağlantını gör."
          Write-Host "KULLANICI: runneradmin"
          Write-Host "========================================================"
          
          Start-Sleep -s 21600
