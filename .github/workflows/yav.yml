name: XRDP (Pinggy Edition)
on: workflow_dispatch

jobs:
  ignite-windows:
    runs-on: windows-latest
    steps:
      - name: RDP ve Pinggy Kurulumu
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "1. RDP Ayarları Yapılandırılıyor..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Password = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin"
          $User | Set-LocalUser -Password $Password
          
          Write-Host "2. Pinggy Tüneli Başlatılıyor..."
          $sshCommand = "ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:3389 qr@a.pinggy.io"
          Write-Host "Tünel başlatılıyor, lütfen loglardaki tcp:// adresini kopyala..."
  
          Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -R0:localhost:3389 qr@a.pinggy.io" -NoNewWindow
          
          Write-Host "3. Tünel URL'si Alınıyor..."
          Start-Sleep -s 10
          # Çıktıyı loglardan takip edebilirsiniz, Pinggy URL'yi SSH bağlantısı üzerinden verir
          
          Write-Host "=================================================================="
          Write-Host "🚀 MATRIX AKTİF (Pinggy)"
          Write-Host "Log satırlarında 'tcp://...' şeklinde başlayan adresi kopyalayın."
          Write-Host "KULLANICI  : runneradmin"
          Write-Host "=================================================================="
          
          Start-Sleep -s 21600
