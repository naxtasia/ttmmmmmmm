name: XRDP (Cloudflare Tunnel)
on: workflow_dispatch

jobs:
  ignite-windows:
    runs-on: windows-latest
    steps:
      - name: RDP ve Cloudflare Tunnel
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "1. RDP Ayarları Yapılandırılıyor..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Password = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin"
          $User | Set-LocalUser -Password $Password
          
          Write-Host "2. Cloudflare Tunnel Kuruluyor..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe
          
          Write-Host "3. Tünel Başlatılıyor (Lütfen URL'yi kopyalayın)..."
          # Cloudflare'in 'trycloudflare' özelliği sayesinde kurulum gerektirmeden direkt URL alırız
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow
          
          Write-Host "4. URL bekleniyor..."
          Start-Sleep -s 20
          
          Write-Host "=================================================================="
          Write-Host "🚀 MATRIX AKTİF (Cloudflare)"
          Write-Host "Logların yukarısına bakın, 'https://...' ile biten"
          Write-Host "yada 'trycloudflare.com' içeren bir URL göreceksiniz."
          Write-Host "KULLANICI  : runneradmin"
          Write-Host "ŞİFRE      : (Secrets kısmına girdiğiniz şifre)"
          Write-Host "=================================================================="
          
          Start-Sleep -s 21600
